name: iOS Build (Unsigned IPA)

# 서명 없는 .ipa를 만든다. 받은 파일은 Sideloadly 등으로 본인 Apple ID로 서명해 아이폰에 설치한다.
# macOS 서버 시간은 일반 서버의 10배로 계산되므로 수동 실행과 이 파일이 바뀐 PR에서만 돈다.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_ENV: production
      NODE_ENV: production
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_WS_URL: ${{ secrets.EXPO_PUBLIC_WS_URL }}
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_CLIENT_KEY: ${{ secrets.EXPO_PUBLIC_CLIENT_KEY }}
      EXPO_PUBLIC_VWORLD_KEY: ${{ secrets.EXPO_PUBLIC_VWORLD_KEY }}
      EXPO_PUBLIC_VWORLD_REFERER: ${{ secrets.EXPO_PUBLIC_VWORLD_REFERER }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: iOS 네이티브 프로젝트 만들기 (expo prebuild)
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods 설치
        working-directory: ios
        run: pod install

      - name: 서명 없이 빌드
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: .ipa로 묶기
        working-directory: ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry sub1s-unsigned.ipa Payload
          ls -la sub1s-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: sub1s-unsigned-ipa
          path: ios/sub1s-unsigned.ipa
          retention-days: 7
